<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCDRC</title>
  <meta name="description" content="HCDRC homepage">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2b5fd9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #ececec;
        --muted: #9a9a9a;
        --accent: #7aa2ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: 0.08em;
    }
    .bar {
      width: 48px;
      height: 3px;
      margin: 0 auto 1.5rem;
      background: var(--accent);
      border-radius: 2px;
    }
    p { margin: 0.25rem 0; color: var(--muted); line-height: 1.6; }
    footer {
      position: fixed;
      bottom: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>HCDRC</h1>
    <div class="bar"></div>
    <p>홈페이지 준비 중입니다.</p>
    <p>This website is under construction.</p>
  </main>
  <footer>&copy; <span id="year">2026</span> HCDRC</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
